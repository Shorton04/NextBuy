{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-envelope-check display-1 text-success"></i>
                    </div>
                    <h2 class="text-center mb-4">Check Your Email</h2>
                    <p class="text-center text-muted">
                        We've sent you instructions for setting your password. 
                        You should receive them shortly.
                    </p>
                    <p class="text-center text-muted">
                        If you don't receive an email within 5 minutes, 
                        please check your spam folder or try again.
                    </p>
                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary">
                            Return to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
