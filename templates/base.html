<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NextBuy{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="#" class="flex-shrink-0 flex items-center">
                        <span class="text-xl font-bold">NextBuy</span>
                    </a>
                </div>
                <div class="flex items-center">
                    <a href="{% url 'cart_detail' %}" class="p-2 text-gray-700 hover:text-gray-900">
                        Cart ({{ cart_count }})
                    </a>
                    {% if user.is_authenticated %}
                        <a href="#" class="ml-4 p-2 text-gray-700 hover:text-gray-900">Logout</a>
                    {% else %}
                        <a href="#" class="ml-4 p-2 text-gray-700 hover:text-gray-900">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% if messages %}
            {% for message in messages %}
                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white mt-8">
        <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500">&copy; 2024 NextBuy. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
